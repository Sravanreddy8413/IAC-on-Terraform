<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terraform AWS Project</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }

    p {
      font-size: 0.95rem;
      color: var(--text-sub);
      background-color: rgba(255, 255, 255, 0.05);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Terraform + AWS + Nginx</h1>
    <h2>Created by Sravan Reddy</h2>
    <p>Provisioned using Terraform</p>
  </main>
</body>
</html>
